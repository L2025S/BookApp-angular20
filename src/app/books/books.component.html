<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Management System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <!-- Page Title -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2>📚 My Library</h2>
        <button class="btn btn-primary" (click)="toggleForm()">
          {{ showForm ? 'Cancel' : 'Add New Book' }}
        </button>
      </div>

      <!-- Add/Edit Form - using @if syntax -->
      @if (showForm) {
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h4 class="card-title mb-3">{{ isEditMode ? '✏️ Edit Book' : '📖 Add New Book' }}</h4>

            <!-- Form Fields -->
            <div class="row">
              <div class="col-12 mb-3">
                <label class="form-label">Title</label>
                <input [(ngModel)]="currentBook.title"
                       class="form-control"
                       placeholder="Enter title">
              </div>
              <div class="col-12 mb-3">
                <label class="form-label">Author</label>
                <input [(ngModel)]="currentBook.author"
                       class="form-control"
                       placeholder="Enter author name">
              </div>
              <div class="col-12 mb-3">
                <label class="form-label">Publication Date</label>
                <input [(ngModel)]="currentBook.publishedDate"
                       type="date"
                       class="form-control">
              </div>
            </div>

            <!-- Form Buttons -->
            <div class="d-flex gap-2">
              <button class="btn btn-success" (click)="saveBook()">💾 Save</button>
              <button class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
            </div>
          </div>
        </div>
      }

      <!-- Book List -->
      @if (books.length === 0) {
        <div class="text-center py-5">
          <p class="text-muted">No books yet. Click "Add New Book" to get started!</p>
        </div>
      }

      <div class="row">
        @for (book of books; track book.id) {
          <div class="col-12 col-sm-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm">
              <div class="card-body">
                <!-- Book Icon -->
                <div class="text-center mb-3">
                  <span style="font-size: 3rem;">📘</span>
                </div>
                <!-- Title -->
                <h5 class="card-title text-center">{{ book.title }}</h5>
                <!-- Author -->
                <p class="card-text text-center text-muted">{{ book.author }}</p>
                <!-- Publication Date -->
                <p class="card-text text-center small">
                  📅 {{ book.publishedDate | date:'MMM d, yyyy' }}
                </p>
              </div>
              <!-- Action Buttons -->
              <div class="card-footer bg-transparent border-0 text-center pb-3">
                <button class="btn btn-sm btn-warning me-2" (click)="editBook(book)">✏️ Edit</button>
                <button class="btn btn-sm btn-danger" (click)="deleteBook(book.id)">🗑️ Delete</button>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
